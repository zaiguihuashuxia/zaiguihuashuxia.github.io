site_name: zaiguihuashuxia
site_description: zaiguihuashuxia 的博客与学习笔记
site_author: zaiguihuashuxia
site_url: https://zaiguihuashuxia.github.io/
repo_url: https://github.com/zaiguihuashuxia/zaiguihuashuxia.github.io
repo_name: GitHub
use_directory_urls: true

theme:
  name: material
  custom_dir: overrides
  language: zh
  logo: assets/osmanthus.svg
  favicon: assets/osmanthus.svg
  font: false
  icon:
    repo: fontawesome/brands/github
  features:
    - content.code.copy
    - navigation.footer
    - navigation.indexes
    - navigation.tabs
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: 切换至深色模式
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: 切换至浅色模式

plugins:
  - search:
      lang:
        - zh
        - en
  - blog:
      blog_dir: blog
      blog_toc: false
      post_date_format: long
      post_url_format: "{date}/{slug}"
      post_url_date_format: yyyy/MM
      post_readtime: false
      archive: false
      categories: false
      pagination_per_page: 10
      authors: false

hooks:
  - hooks/knowledge_library.py

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences

extra_css:
  - https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&display=swap
  - stylesheets/extra.css

extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js

extra:
  homepage: https://zaiguihuashuxia.github.io/
  # Comments via giscus (https://giscus.app), stored in this repo's Discussions.
  # Comments stay hidden until repo_id and category_id are filled in.
  giscus:
    repo: zaiguihuashuxia/zaiguihuashuxia.github.io
    repo_id: ""
    category: Announcements
    category_id: ""
  generator: false
  social:
    - icon: material/home-outline
      link: https://zaiguihuashuxia.github.io/
      name: 主页
    - icon: fontawesome/brands/github
      link: https://github.com/zaiguihuashuxia
      name: GitHub

validation:
  links:
    absolute_links: relative_to_docs
    anchors: warn
    not_found: warn
    unrecognized_links: warn

copyright: '&copy; 2026 <a href="https://zaiguihuashuxia.github.io/">zaiguihuashuxia</a> · <em>less is more</em>'
