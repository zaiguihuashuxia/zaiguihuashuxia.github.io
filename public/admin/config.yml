# 写作后台（Sveltia CMS）配置，文档：https://sveltiacms.app/en/docs
# 笔记相关的 collections 在 notes.js 里生成，会接在这里的 collections 后面。
# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms@0.262.1/schema/sveltia-cms.json

backend:
  name: github
  repo: zaiguihuashuxia/zaiguihuashuxia.github.io
  branch: main
  commit_messages:
    create: "content: 新建「{{slug}}」"
    update: "content: 更新「{{slug}}」"
    delete: "content: 删除「{{slug}}」"
    uploadMedia: "content: 上传 {{path}}"
    deleteMedia: "content: 删除 {{path}}"

site_url: https://zaiguihuashuxia.github.io/
display_url: https://zaiguihuashuxia.github.io/

media_folder: public/assets/images
public_folder: /assets/images

output:
  omit_empty_optional_fields: true

collections:
  - name: posts
    label: 博客
    label_singular: 文章
    description: 写完点保存，GitHub 会自动构建，一两分钟后发布到网站。
    folder: public/blog/posts
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{fields.slug}}"
    media_folder: images
    public_folder: images
    sortable_fields: [date, title]
    fields:
      - { name: title, label: 标题, widget: string }
      - name: slug
        label: 网址
        widget: string
        hint: 文章网址的最后一段，只能用小写英文、数字和连字符，例如 first-post
        pattern: ["^[a-z0-9]+(-[a-z0-9]+)*$", "只能用小写英文、数字和连字符"]
      - { name: date, label: 日期, widget: datetime, type: date, default: "{{now}}" }
      - { name: description, label: 摘要, widget: string, required: false, hint: 显示在搜索结果和分享卡片里 }
      - { name: draft, label: 草稿, widget: boolean, required: false, default: false, hint: 打开后这篇不会出现在网站上 }
      - { name: comments, label: 评论, widget: boolean, required: false, default: true, hint: 关掉后这篇文章底部不显示评论区 }
      - name: body
        label: 正文
        widget: markdown
        modes: [raw, rich_text]
        hint: 列表页只显示第一段；想自己决定截到哪里，就在那里单独写一行 <!-- more -->

  # 笔记的 collections 不写在这里：notes.js 按「笔记专题」里的列表生成，每个专题一个，
  # 对应 public/notes/<文件夹>/。在后台改了专题列表，刷新页面就能看到。
